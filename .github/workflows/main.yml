name: Wails build

on:
  push:
    tags:
    # Match any new tag
      - '*'

env:
  # Necessary for most environments as build failure can occur due to OOM issues
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    permissions:
      contents: write
    strategy:
    # Failure in one platform build won't impact the others
      fail-fast: false
      matrix:
        build:
          - name: 'windows-amd64'
            platform:  'windows/amd64'
            os: 'windows-latest'
          - name: 'mac-arm64'
            platform:  'darwin/arm64'
            os: 'macos-latest'

    runs-on: ${{ matrix.build.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: 'go-build'
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.1

      - name: Build Wails
        run: wails build -platform ${{ matrix.build.platform }}

      - name: Zip Mac Build
        if: matrix.build.platform == 'darwin/arm64'
        run: zip -r build/bin/course-assistant-mac-arm64.app.zip build/bin/北师大选课助手.app

      # - name: Create Release
      #   uses: softprops/action-gh-release@v2
      #   with:
      #     files: |
      #       build/bin/*
      #     draft: false
      #     prerelease: true
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.build.name }}
          path: build/bin/*
